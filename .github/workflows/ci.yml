name: SEENA verification

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: seena-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Pure measurement tests
        run: swift test
      - name: Compile iPhone app (Debug)
        run: >-
          xcodebuild
          -project SeeNA.xcodeproj
          -scheme SeeNA
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/seena-derived"
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Compile iPhone app (Release)
        run: >-
          xcodebuild
          -project SeeNA.xcodeproj
          -scheme SeeNA
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/seena-derived-release"
          CODE_SIGNING_ALLOWED=NO
          build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
